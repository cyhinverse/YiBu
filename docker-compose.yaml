services:
  server:
    build: ./server
    container_name: social_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      # Force Docker services to use Docker Mongo (avoid accidental Atlas/host env override).
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      # Must be provided via environment (.env or deployment secrets).
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      # Local Docker runs are usually plain HTTP, so secure cookies would be dropped by the browser.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      # Required for uploading images/videos (avatar/cover/post media) to Cloudinary.
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      - mongo
      - redis
    networks:
      - social_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: social_client
    ports:
      - "3000:80"
    environment:
      # Nginx proxies /api + /socket.io to the server container.
      - NGINX_PROXY_PASS=http://server:5000
    depends_on:
      - server
    networks:
      - social_network

  mongo:
    image: mongo:latest
    container_name: social_mongo
    ports:
      # Use 27018 by default to avoid conflicts with local MongoDB on 27017.
      # Override via `MONGO_HOST_PORT=27017` if you want the default port.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - social_network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 10s
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: social_redis
    ports:
      - "6379:6379"
    networks:
      - social_network

networks:
  social_network:
    driver: bridge

volumes:
  mongo_data:
