services:
  server:
    build: ./server
    container_name: social_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      # Force Docker services to use Docker Mongo (avoid accidental Atlas/host env override).
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      # Provide non-empty defaults for local Docker runs (required by auth middleware).
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-dev_access_token_secret_change_me}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-dev_refresh_token_secret_change_me}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      - mongo
      - redis
    networks:
      - social_network

  client:
    build: ./client
    container_name: social_client
    ports:
      - "3000:9258"
    environment:
      # Vite dev proxy inside container must hit the server container, not localhost.
      - VITE_PROXY_TARGET=http://server:5000
    depends_on:
      - server
    networks:
      - social_network

  mongo:
    image: mongo:latest
    container_name: social_mongo
    ports:
      # Use 27018 by default to avoid conflicts with local MongoDB on 27017.
      # Override via `MONGO_HOST_PORT=27017` if you want the default port.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - social_network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 10s
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: social_redis
    ports:
      - "6379:6379"
    networks:
      - social_network

  # One-off: docker compose run --rm seed --drop
  seed:
    build: ./server
    container_name: social_seed
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
    depends_on:
      - mongo
    entrypoint: ["node", "scripts/seed.js"]
    networks:
      - social_network

  # One-off: docker compose run --rm hashtags-sync [--prune]
  hashtags-sync:
    build: ./server
    container_name: social_hashtags_sync
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
    depends_on:
      - mongo
    entrypoint: ["node", "scripts/sync-hashtags.js"]
    networks:
      - social_network

  # Auto scheduler: keeps Hashtags in sync with Posts.
  # Config:
  # - HASHTAGS_SYNC_INTERVAL_SEC (default 900 = 15 minutes)
  # - HASHTAGS_SYNC_PRUNE ("true" to delete tags not found in Posts; default "false")
  hashtags-sync-scheduler:
    build: ./server
    container_name: social_hashtags_sync_scheduler
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      - HASHTAGS_SYNC_INTERVAL_SEC=${HASHTAGS_SYNC_INTERVAL_SEC:-900}
      # Default: prune enabled (delete hashtags with no posts).
      - HASHTAGS_SYNC_PRUNE=${HASHTAGS_SYNC_PRUNE:-true}
    depends_on:
      - mongo
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # NOTE: docker compose does interpolation on the YAML file.
        # Use $$ to defer $-expansion to the container shell.
        INTERVAL="$$HASHTAGS_SYNC_INTERVAL_SEC"
        PRUNE="$$HASHTAGS_SYNC_PRUNE"
        if [ -z "$$INTERVAL" ]; then INTERVAL="900"; fi
        if [ -z "$$PRUNE" ]; then PRUNE="false"; fi
        echo "Hashtag sync scheduler started: interval=$$INTERVAL""s prune=$$PRUNE"
        while true; do
          if [ "$$PRUNE" = "true" ]; then
            node scripts/sync-hashtags.js --prune
          else
            node scripts/sync-hashtags.js
          fi
          sleep "$$INTERVAL"
        done
    networks:
      - social_network

networks:
  social_network:
    driver: bridge

volumes:
  mongo_data:
