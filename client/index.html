<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yibu</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Apply theme settings immediately to prevent flash of unstyled content
      (function () {
        var root = document.documentElement;
        
        // Apply dark/light mode
        // Preference order:
        // 1) localStorage.theme (new)
        // 2) localStorage.appearance (legacy admin)
        // 3) redux-persist user.settings.theme.appearance (fallback)
        // 4) system preference
        var theme = localStorage.getItem("theme") || localStorage.getItem("appearance");
        if (!theme) {
          try {
            var persistedRoot = localStorage.getItem("persist:root");
            if (persistedRoot) {
              var parsedRoot = JSON.parse(persistedRoot);
              if (parsedRoot && parsedRoot.user) {
                var userData = JSON.parse(parsedRoot.user);
                theme = userData && userData.settings && userData.settings.theme && userData.settings.theme.appearance;
              }
            }
          } catch (e) {
            // Ignore and fall back to system preference
          }
        }

        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = theme === "dark" || ((theme === "system" || !theme) && prefersDark);
        if (isDark) {
          root.classList.add("dark");
        } else {
          root.classList.remove("dark");
        }
        
        // Apply custom colors
        var primaryColor = localStorage.getItem("primaryColor");
        var secondaryColor = localStorage.getItem("secondaryColor");
        var textColor = localStorage.getItem("textColor");
        var fontSize = localStorage.getItem("fontSize");
        
        if (primaryColor) {
          root.style.setProperty("--color-primary", primaryColor);
        }
        if (secondaryColor) {
          root.style.setProperty("--color-secondary", secondaryColor);
        }
        if (textColor) {
          root.style.setProperty("--color-content", textColor);
        }
        if (fontSize) {
          var sizeMap = { small: "14px", medium: "16px", large: "18px" };
          root.style.fontSize = sizeMap[fontSize] || "16px";
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
