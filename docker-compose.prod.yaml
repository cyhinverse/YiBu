services:
  server:
    build:
      context: ./server
      target: prod
    container_name: social_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-dev_access_token_secret_change_me}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-dev_refresh_token_secret_change_me}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - social_network

  client:
    build:
      context: ./client
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    container_name: social_client
    ports:
      - "${CLIENT_HOST_PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - social_network

  mongo:
    image: mongo:latest
    container_name: social_mongo
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - social_network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 10s
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: social_redis
    ports:
      - "6379:6379"
    networks:
      - social_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: social_rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - social_network

  seed:
    build:
      context: ./server
      target: prod
    container_name: social_seed
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["node", "scripts/seed.js"]
    networks:
      - social_network

  hashtags-sync:
    build:
      context: ./server
      target: prod
    container_name: social_hashtags_sync
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["node", "scripts/sync-hashtags.js"]
    networks:
      - social_network

  hashtags-sync-scheduler:
    build:
      context: ./server
      target: prod
    container_name: social_hashtags_sync_scheduler
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/socialmedia
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - HASHTAGS_SYNC_INTERVAL_SEC=${HASHTAGS_SYNC_INTERVAL_SEC:-900}
      - HASHTAGS_SYNC_PRUNE=${HASHTAGS_SYNC_PRUNE:-true}
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        INTERVAL="$$HASHTAGS_SYNC_INTERVAL_SEC"
        PRUNE="$$HASHTAGS_SYNC_PRUNE"
        if [ -z "$$INTERVAL" ]; then INTERVAL="900"; fi
        if [ -z "$$PRUNE" ]; then PRUNE="false"; fi
        echo "Hashtag sync scheduler started: interval=$$INTERVAL""s prune=$$PRUNE"
        while true; do
          if [ "$$PRUNE" = "true" ]; then
            node scripts/sync-hashtags.js --prune
          else
            node scripts/sync-hashtags.js
          fi
          sleep "$$INTERVAL"
        done
    networks:
      - social_network

networks:
  social_network:
    driver: bridge

volumes:
  mongo_data:
